name: Inference tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m compileall -q src HIERA_VEP_COMPLETE_CODE.py
      - run: python src/hiera_vep_score.py --bundle . --input examples/example_scoring_input.tsv --output examples/example_predictions.tsv
      - run: python -c "import pandas as pd; d=pd.read_csv('examples/example_predictions.tsv',sep='\t'); assert len(d)>0 and d.reconstruction_error.max()<1e-5"
